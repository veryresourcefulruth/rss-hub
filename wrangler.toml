name = "rss-hub"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Custom domain later, e.g. hub.resourcefulruth.co.uk:
# [[routes]]
# pattern = "hub.resourcefulruth.co.uk"
# custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "rss-hub"
database_id = "08b73304-8492-4722-910c-8be5c70edb52"
migrations_dir = "migrations"

# Read-only use: Childcare 101 results from the training app.
[[d1_databases]]
binding = "TRAINING"
database_name = "rss-training"
database_id = "2c617dc3-ff95-4c6c-abc4-dd0e04fe02a1"
migrations_dir = "migrations-none"

